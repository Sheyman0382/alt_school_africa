<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        
      body {
        background-color: black;
      }
      
      .card {
        width: 350px;
        background-color: whitesmoke;
        border-radius: 8px;
        padding: 30px;
      }

      .header {
        width: 250px;
        font-size: 1.5rem;
        font-weight: bold;
        text-align: center;
        padding: .8em;
        margin-inline: auto;
        border-radius: 6px;
        background-color: deeppink;
        margin-top: -60px;
      }

      .paragraph {
        font-size: 1.5rem;
        line-height: 1.5;
        
        margin-bottom: 0;
      }

      .container {
        display: flex;
        justify-content: center;
        padding-top: 80px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="header">An Otters Essay</p>
        <p class="paragraph">
          Otters have long, slim bodies and relatively short limbs. Their most
          striking anatomical features are the powerful webbed feet used to
          swim, and their seal-like abilities holding breath underwater.
        </p>
      </div>
    </div>
  </body>
</html>
